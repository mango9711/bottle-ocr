<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭调酒台 · 按库存推荐鸡尾酒配方</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg0: #060d0b;
    --emerald: #103d33;
    --emerald-light: #1b5e4e;
    --gold: #d4af6a;
    --gold-light: #ecd39a;
    --gold-deep: #a9823f;
    --card: rgba(19, 46, 40, 0.42);
    --card-border: rgba(212, 175, 106, 0.24);
    --text: #f2ede1;
    --soft: rgba(242, 237, 225, 0.66);
    --faint: rgba(242, 237, 225, 0.42);
    --ok: #7fce9a;
    --miss: #e8a05a;
    --c-base: #ddb06b;
    --c-liqueur: #e88aa6;
    --c-syrup: #e6c86a;
    --c-mixer: #5fc7b6;
    --c-extra: #8cc98a;
    --serif: "Times New Roman", Georgia, "Songti SC", serif;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background:
      radial-gradient(900px 480px at 50% -8%, rgba(212, 175, 106, 0.15), transparent 62%),
      radial-gradient(780px 480px at 90% 24%, rgba(27, 94, 78, 0.34), transparent 60%),
      radial-gradient(720px 520px at 4% 72%, rgba(16, 61, 51, 0.4), transparent 62%),
      linear-gradient(180deg, #0a1714 0%, #060d0b 100%);
    background-attachment: fixed;
    min-height: 100vh;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 36px 16px 96px;
  }

  .app { width: 100%; max-width: 780px; }

  header { text-align: center; margin-bottom: 22px; }
  header h1 {
    font-size: 32px; letter-spacing: 3px; font-weight: 800;
    background: linear-gradient(90deg, var(--gold-light), var(--gold) 55%, #a9823f);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { font-size: 14px; color: var(--soft); margin-top: 8px; line-height: 1.7; }
  header .rule {
    width: 64px; height: 2px; margin: 14px auto 0; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .site-share-btn {
    margin-top: 16px;
    font-family: inherit; font-size: 13px; letter-spacing: 0.5px; cursor: pointer;
    color: var(--gold-light);
    background: rgba(212, 175, 106, 0.08);
    border: 1px solid rgba(212, 175, 106, 0.45);
    border-radius: 999px; padding: 9px 22px;
    transition: 0.2s;
  }
  .site-share-btn:hover { background: rgba(212, 175, 106, 0.18); border-color: rgba(212, 175, 106, 0.75); transform: translateY(-1px); }
  .site-share-btn:active { transform: translateY(0); }

  .panel {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 22px 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
  }

  .panel-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .panel-head h2 { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
  .panel-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mini-btn {
    font-family: inherit; font-size: 12.5px; cursor: pointer;
    color: var(--soft); background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(244, 234, 217, 0.16);
    border-radius: 999px; padding: 6px 14px; transition: 0.2s;
  }
  .mini-btn:hover { color: var(--text); border-color: rgba(212, 175, 106, 0.5); }
  .inv-count { font-size: 12.5px; color: var(--faint); }
  .inv-count b { color: var(--gold-light); font-size: 15px; }

  .cat { margin-top: 20px; }
  .cat-title { display: flex; align-items: center; gap: 9px; font-size: 14.5px; font-weight: 700; }
  .cat-title .dot { width: 9px; height: 9px; border-radius: 50%; }
  .cat-title .cat-hint { font-size: 12px; font-weight: 400; color: var(--faint); }
  .cat[data-cat="base"] .dot { background: var(--c-base); box-shadow: 0 0 8px var(--c-base); }
  .cat[data-cat="liqueur"] .dot { background: var(--c-liqueur); box-shadow: 0 0 8px var(--c-liqueur); }
  .cat[data-cat="syrup"] .dot { background: var(--c-syrup); box-shadow: 0 0 8px var(--c-syrup); }
  .cat[data-cat="mixer"] .dot { background: var(--c-mixer); box-shadow: 0 0 8px var(--c-mixer); }
  .cat[data-cat="extra"] .dot { background: var(--c-extra); box-shadow: 0 0 8px var(--c-extra); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
  .chip {
    font-family: inherit; font-size: 13px; cursor: pointer;
    padding: 8px 15px; border-radius: 999px;
    color: var(--soft); background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(244, 234, 217, 0.16);
    transition: transform 0.12s ease, background 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .chip:hover { transform: translateY(-1px); border-color: rgba(244, 234, 217, 0.35); }
  .chip.on { color: #0d1815; font-weight: 700; border-color: transparent; }
  .cat[data-cat="base"] .chip.on { background: var(--c-base); box-shadow: 0 5px 16px -4px var(--c-base); }
  .cat[data-cat="liqueur"] .chip.on { background: var(--c-liqueur); box-shadow: 0 5px 16px -4px var(--c-liqueur); }
  .cat[data-cat="syrup"] .chip.on { background: var(--c-syrup); box-shadow: 0 5px 16px -4px var(--c-syrup); }
  .cat[data-cat="mixer"] .chip.on { background: var(--c-mixer); box-shadow: 0 5px 16px -4px var(--c-mixer); }
  .cat[data-cat="extra"] .chip.on { background: var(--c-extra); box-shadow: 0 5px 16px -4px var(--c-extra); }

  .gen-wrap { margin: 20px 0 8px; }
  .gen-btn {
    width: 100%; font-family: inherit; cursor: pointer;
    padding: 17px 0; border: none; border-radius: 16px;
    font-size: 17px; font-weight: 800; letter-spacing: 2px;
    color: #0d1815;
    background: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, #a9823f);
    box-shadow: 0 12px 32px rgba(212, 175, 106, 0.32);
    transition: transform 0.12s ease, box-shadow 0.25s ease;
  }
  .gen-btn:hover { box-shadow: 0 14px 40px rgba(212, 175, 106, 0.48); }
  .gen-btn:active { transform: scale(0.98); }

  .results { margin-top: 30px; }
  .results-head { text-align: center; margin-bottom: 16px; }
  .results-head h2 { font-size: 20px; font-weight: 800; letter-spacing: 1px; }
  .results-head p { font-size: 13px; color: var(--soft); margin-top: 6px; }

  .recipe-card {
    position: relative; overflow: hidden;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 22px 22px 18px;
    margin-bottom: 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.32);
    animation: fadeUp 0.5s both;
  }
  .recipe-card:nth-child(2) { animation-delay: 0.08s; }
  .recipe-card:nth-child(3) { animation-delay: 0.16s; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .r-num {
    position: absolute; right: 16px; top: 6px;
    font-size: 60px; font-weight: 900; line-height: 1;
    color: rgba(212, 175, 106, 0.09);
    pointer-events: none; user-select: none;
  }

  .badge {
    position: absolute; top: 18px; right: 18px;
    font-size: 12px; font-weight: 700;
    padding: 6px 13px; border-radius: 999px;
  }
  .badge.ok { color: var(--ok); background: rgba(127, 206, 154, 0.13); border: 1px solid rgba(127, 206, 154, 0.42); }
  .badge.no { color: var(--miss); background: rgba(232, 160, 90, 0.12); border: 1px solid rgba(232, 160, 90, 0.45); }

  .recipe-card { transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; }
  .recipe-card::before {
    content: ""; position: absolute; left: 0; top: 22px; bottom: 22px; width: 3px;
    border-radius: 0 3px 3px 0;
    background: linear-gradient(180deg, var(--gold-light), var(--gold-deep));
    opacity: 0.75;
  }
  .recipe-card:hover {
    transform: translateY(-3px);
    border-color: rgba(212, 175, 106, 0.5);
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(212, 175, 106, 0.12);
  }
  .badge.creative { color: var(--gold-light); background: rgba(212, 175, 106, 0.14); border: 1px solid rgba(212, 175, 106, 0.5); }
  .badge.fav { color: #e88aa6; background: rgba(232, 138, 166, 0.12); border: 1px solid rgba(232, 138, 166, 0.45); }

  .r-name { font-size: 23px; font-weight: 800; letter-spacing: 1px; padding-right: 130px; }
  .r-en { font-family: var(--serif); font-size: 14px; color: var(--faint); margin-top: 3px; font-style: italic; letter-spacing: 0.5px; }

  .r-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 11px; font-size: 12.5px; color: var(--soft); }
  .r-meta .meta-item {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(244, 234, 217, 0.12);
    border-radius: 8px; padding: 3px 10px;
  }
  .strength { display: inline-flex; align-items: center; gap: 5px; }
  .strength .sd { width: 6px; height: 6px; border-radius: 50%; background: rgba(244, 234, 217, 0.18); }
  .strength .sd.on { background: var(--gold); box-shadow: 0 0 6px rgba(212, 175, 106, 0.7); }

  .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .tag {
    font-size: 12px; font-weight: 600;
    padding: 3.5px 12px; border-radius: 999px;
    border: 1px solid;
  }

  .r-desc { font-size: 13.5px; line-height: 1.75; color: var(--soft); margin-top: 13px; }

  .r-section-t { font-size: 13px; font-weight: 700; color: var(--gold-light); margin: 16px 0 4px; letter-spacing: 1px; }

  .ing-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 8px 0; border-bottom: 1px dashed rgba(244, 234, 217, 0.09);
    font-size: 13.5px;
  }
  .ing-row:last-child { border-bottom: none; }
  .ing-name { display: flex; align-items: center; gap: 8px; }
  .ing-name .sdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .ing-row.have .sdot { background: var(--ok); }
  .ing-row.miss .sdot { background: var(--miss); }
  .ing-row.optional .ing-name > span:last-child { color: var(--faint); }
  .ing-amount { color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; }
  .ing-row.miss .ing-name { color: var(--miss); font-weight: 600; }
  .ing-row.miss .ing-amount { color: rgba(232, 160, 90, 0.75); }
  .sub-tip { display: block; font-size: 12px; color: var(--faint); margin: 2px 0 0 15px; line-height: 1.6; }

  .steps { list-style: none; counter-reset: step; margin-top: 2px; }
  .steps li {
    counter-increment: step; position: relative;
    font-size: 13.5px; line-height: 1.75; color: var(--soft);
    padding: 6px 0 6px 34px;
  }
  .steps li::before {
    content: counter(step);
    position: absolute; left: 0; top: 7px;
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(212, 175, 106, 0.15); border: 1px solid rgba(212, 175, 106, 0.4);
    color: var(--gold-light); font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  .r-garnish {
    margin-top: 14px; font-size: 12.5px; color: var(--faint);
    padding-top: 12px; border-top: 1px solid rgba(244, 234, 217, 0.08);
  }
  .r-garnish b { color: var(--soft); font-weight: 600; }

  .hint-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 11px 2px; border-bottom: 1px dashed rgba(244, 234, 217, 0.09);
    font-size: 14px;
  }
  .hint-row:last-child { border-bottom: none; }
  .hint-name { font-weight: 700; }
  .hint-miss { color: var(--miss); font-size: 12.5px; text-align: right; line-height: 1.5; }

  .photo-btn { color: var(--gold-light); border-color: rgba(212, 175, 106, 0.45); background: rgba(212, 175, 106, 0.08); }
  .album-btn { color: var(--gold-light); border-color: rgba(212, 175, 106, 0.3); }
  .chip.add { border-style: dashed; color: var(--gold-light); }
  .chip.custom .chip-x { margin-left: 7px; opacity: 0.55; font-weight: 700; }
  .chip.custom .chip-x:hover { opacity: 1; }
  .chip-form { display: inline-flex; gap: 6px; align-items: center; }
  .chip-form input {
    font-family: inherit; font-size: 13px; color: var(--text);
    background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(212, 175, 106, 0.55);
    border-radius: 999px; padding: 8px 14px; outline: none; width: 150px;
  }
  .chip-form button { font-family: inherit; cursor: pointer; border-radius: 999px; padding: 8px 13px; font-size: 13px; border: none; line-height: 1; }
  .chip-form .ok { background: var(--gold); color: #0d1815; font-weight: 700; }
  .chip-form .cancel { background: rgba(255, 255, 255, 0.08); color: var(--soft); }

  .ocr-bar {
    margin: 20px 0 14px; background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--card-border); border-radius: 14px; padding: 12px 16px;
  }
  .ocr-bar .t { font-size: 13px; color: var(--gold-light); margin-bottom: 8px; }
  .ocr-track { height: 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
  .ocr-track i {
    display: block; height: 100%; width: 0; border-radius: 6px;
    background: linear-gradient(90deg, var(--gold-light), var(--gold)); transition: width 0.25s;
  }

  .modal {
    position: fixed; inset: 0; z-index: 90;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(4, 10, 9, 0.68); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .modal[hidden] { display: none; }
  .modal-card {
    width: 100%; max-width: 460px; max-height: 82vh; overflow-y: auto;
    background: #0e201c; border: 1px solid var(--card-border);
    border-radius: 20px; padding: 22px 20px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  }
  .modal-card h3 { font-size: 17px; color: var(--gold-light); }
  .modal-sub { font-size: 12.5px; color: var(--soft); margin: 8px 0 14px; line-height: 1.7; }
  .modal-row { display: flex; gap: 8px; align-items: center; margin-bottom: 9px; }
  .modal-row input[type="text"] {
    flex: 1; min-width: 0; font-family: inherit; font-size: 13px; color: var(--text);
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(244, 234, 217, 0.2);
    border-radius: 10px; padding: 9px 10px;
  }
  .modal-row select {
    font-family: inherit; font-size: 12px; color: var(--text);
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(244, 234, 217, 0.2);
    border-radius: 10px; padding: 9px 6px; flex-shrink: 0;
  }
  .modal-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--gold); flex-shrink: 0; cursor: pointer; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions button {
    flex: 1; padding: 12px 0; border-radius: 12px; font-family: inherit;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .modal-ok { background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: #0d1815; border: none; }
  .modal-cancel { background: rgba(255, 255, 255, 0.06); color: var(--soft); border: 1px solid rgba(244, 234, 217, 0.18); }

  .shuffle-wrap { text-align: center; margin-top: 4px; }
  .shuffle-btn {
    font-family: inherit; font-size: 13.5px; cursor: pointer;
    color: var(--gold-light); background: rgba(212, 175, 106, 0.1);
    border: 1px solid rgba(212, 175, 106, 0.4);
    border-radius: 999px; padding: 10px 26px; transition: 0.2s;
  }
  .shuffle-btn:hover { background: rgba(212, 175, 106, 0.2); }

  .toast {
    position: fixed; bottom: 34px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #122923; color: var(--gold-light);
    border: 1px solid rgba(212, 175, 106, 0.4);
    padding: 12px 24px; border-radius: 14px; font-size: 14px; font-weight: 600;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 99; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  #dock.show ~ #toast { bottom: 100px; }

  footer { text-align: center; margin-top: 40px; font-size: 12px; color: var(--faint); line-height: 1.8; }

  /* ---------- 搜索栏 ---------- */
  .inv-toolbar { display: flex; gap: 9px; margin-top: 14px; }
  .search-box {
    position: relative; flex: 1; min-width: 0;
  }
  .search-box .ico {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    font-size: 13px; color: var(--faint); pointer-events: none;
  }
  .search-box input {
    width: 100%; font-family: inherit; font-size: 13.5px; color: var(--text);
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(242, 237, 225, 0.16);
    border-radius: 999px; padding: 10px 36px 10px 34px; outline: none; transition: 0.2s;
  }
  .search-box input:focus { border-color: rgba(212, 175, 106, 0.6); background: rgba(212, 175, 106, 0.06); }
  .search-box input::placeholder { color: var(--faint); }
  .search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(242, 237, 225, 0.12); color: var(--soft); font-size: 12px; line-height: 1;
    display: none; align-items: center; justify-content: center;
  }
  .search-clear.show { display: flex; }
  .fav-entry {
    flex-shrink: 0; font-family: inherit; font-size: 13px; cursor: pointer;
    color: var(--gold-light); background: rgba(212, 175, 106, 0.08);
    border: 1px solid rgba(212, 175, 106, 0.32); border-radius: 999px; padding: 0 16px;
    transition: 0.2s; white-space: nowrap;
  }
  .fav-entry:hover { background: rgba(212, 175, 106, 0.18); }
  .fav-entry b { color: var(--gold); }
  .search-empty { display: none; font-size: 13px; color: var(--faint); padding: 6px 2px 0; }

  /* ---------- 分类折叠 ---------- */
  .cat-title { cursor: pointer; user-select: none; }
  .cat-title .chev {
    margin-left: auto; color: var(--faint); font-size: 11px;
    transition: transform 0.25s;
  }
  .cat.collapsed .chev { transform: rotate(-90deg); }
  .cat.collapsed .chips, .cat.collapsed .cat-hint { display: none; }

  .chip { min-height: 36px; }
  .chip.flash { animation: chipFlash 1.1s ease; }
  @keyframes chipFlash {
    0%, 70% { box-shadow: 0 0 0 0 rgba(212, 175, 106, 0.55); }
    100% { box-shadow: 0 0 0 12px rgba(212, 175, 106, 0); }
  }

  /* ---------- 卡片：杯数 / 操作 / 步骤勾选 ---------- */
  .r-section-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 16px 0 4px; }
  .r-section-row .r-section-t { margin: 0; }
  .servings { display: inline-flex; align-items: center; gap: 8px; }
  .servings button {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    font-family: inherit; font-size: 15px; line-height: 1; font-weight: 700;
    color: var(--gold-light); background: rgba(212, 175, 106, 0.1);
    border: 1px solid rgba(212, 175, 106, 0.4); transition: 0.15s;
  }
  .servings button:hover { background: rgba(212, 175, 106, 0.22); }
  .servings button:disabled { opacity: 0.3; cursor: default; }
  .servings .sv-num { min-width: 44px; text-align: center; font-size: 13px; color: var(--soft); font-variant-numeric: tabular-nums; }
  .servings .sv-num b { color: var(--gold-light); font-size: 15px; }

  .steps li { cursor: pointer; border-radius: 8px; transition: color 0.2s; }
  .steps li:hover { color: var(--text); }
  .steps li.done { color: var(--faint); text-decoration: line-through; text-decoration-color: rgba(212, 175, 106, 0.5); }
  .steps li.done::before { content: "✓"; background: rgba(212, 175, 106, 0.28); color: var(--gold-light); }

  .r-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(242, 237, 225, 0.08); }
  .act-btn {
    font-family: inherit; font-size: 12.5px; cursor: pointer;
    color: var(--soft); background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(242, 237, 225, 0.16); border-radius: 999px;
    padding: 8px 16px; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px;
  }
  .act-btn:hover { color: var(--text); border-color: rgba(212, 175, 106, 0.5); background: rgba(212, 175, 106, 0.08); }
  .act-btn.faved { color: #e88aa6; border-color: rgba(232, 138, 166, 0.5); background: rgba(232, 138, 166, 0.1); }
  .step-progress { font-size: 11.5px; color: var(--faint); margin-left: auto; align-self: center; }

  /* ---------- 我的收藏 ---------- */
  .fav-section { margin-top: 30px; }
  .fav-empty {
    text-align: center; font-size: 13.5px; color: var(--faint); line-height: 1.9;
    border: 1px dashed rgba(212, 175, 106, 0.3); border-radius: 18px; padding: 34px 20px;
  }

  /* ---------- 吸底操作栏 ---------- */
  .dock {
    position: fixed; left: 50%; bottom: 14px; transform: translate(-50%, 90px);
    width: calc(100% - 28px); max-width: 748px; z-index: 80;
    display: flex; align-items: center; gap: 12px;
    background: rgba(12, 28, 24, 0.86);
    border: 1px solid rgba(212, 175, 106, 0.32);
    border-radius: 18px; padding: 10px 12px 10px 18px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5);
  }
  .dock.show {
    transform: translate(-50%, 0);
    transition: transform 0.32s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .dock .dock-info { font-size: 13px; color: var(--soft); white-space: nowrap; }
  .dock .dock-info b { color: var(--gold-light); font-size: 16px; }
  .dock .dock-btn {
    flex: 1; font-family: inherit; font-size: 15px; font-weight: 800; letter-spacing: 1.5px;
    color: #0d1815; cursor: pointer; border: none; border-radius: 12px; padding: 13px 0;
    background: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, var(--gold-deep));
    box-shadow: 0 8px 22px rgba(212, 175, 106, 0.3);
  }
  .dock .dock-btn:active { transform: scale(0.98); }
  .dock .dock-up {
    width: 42px; height: 42px; border-radius: 12px; cursor: pointer; flex-shrink: 0;
    color: var(--gold-light); background: rgba(212, 175, 106, 0.1);
    border: 1px solid rgba(212, 175, 106, 0.35); font-size: 16px;
  }

  /* ---------- 分享图模态 ---------- */
  .share-card {
    max-width: 520px; text-align: center; background: #0e201c;
    display: flex; flex-direction: column; max-height: 90vh;
  }
  .share-card h3 { flex: 0 0 auto; }
  .share-card img {
    flex: 0 1 auto; min-height: 0;
    width: auto; height: auto; max-width: 100%;
    max-height: calc(90vh - 196px);
    margin: 0 auto 14px;
    border-radius: 14px; border: 1px solid var(--card-border);
    object-fit: contain;
  }
  .share-tip { flex: 0 0 auto; font-size: 12px; color: var(--faint); margin-bottom: 14px; line-height: 1.7; }
  .share-actions { flex: 0 0 auto; display: flex; gap: 10px; }
  .share-actions button {
    flex: 1; padding: 12px 0; border-radius: 12px; font-family: inherit;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .share-actions .modal-ok { background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: #0d1815; border: none; }
  .share-actions .modal-cancel { background: rgba(255, 255, 255, 0.06); color: var(--soft); border: 1px solid rgba(242, 237, 225, 0.18); }

  @media (max-width: 560px) {
    body { padding: 26px 12px 92px; }
    header h1 { font-size: 27px; letter-spacing: 2px; }
    .panel { padding: 18px 15px; border-radius: 18px; }
    .panel-head h2 { font-size: 16px; }
    .mini-btn { padding: 8px 12px; font-size: 12px; }
    .inv-count { width: 100%; text-align: right; order: 3; }
    .recipe-card { padding: 20px 17px 16px; }
    .r-name { font-size: 20px; padding-right: 96px; }
    .badge { font-size: 11px; padding: 5px 10px; top: 15px; right: 15px; }
    .r-num { font-size: 46px; }
    .gen-btn { padding: 16px 0; font-size: 16px; }
    .dock { bottom: 10px; width: calc(100% - 20px); }
    .dock .dock-info { font-size: 12px; }
    .share-card { max-height: 92vh; padding: 18px 16px; }
    .share-card img { max-height: calc(92vh - 182px); }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>家庭调酒台</h1>
    <p>勾选家里现有的基酒、利口酒、糖浆、软饮与新鲜配料<br>为你匹配今晚就能调的鸡尾酒，标注每款的风味</p>
    <div class="rule"></div>
    <button class="site-share-btn" id="siteShareBtn" type="button">📲 分享给酒友 · 扫码进入</button>
  </header>

  <section class="panel">
    <div class="panel-head">
      <h2>我的酒柜</h2>
      <div class="panel-actions">
        <button class="mini-btn photo-btn" id="photoBtn">📷 拍照识别</button>
        <button class="mini-btn album-btn" id="albumBtn">🖼️ 从相册选择</button>
        <button class="mini-btn" id="demoBtn">一键填入常见酒柜</button>
        <button class="mini-btn" id="clearBtn">清空</button>
        <span class="inv-count">已选 <b id="invCount">0</b> 样</span>
      </div>
    </div>
    <div class="ocr-bar" id="ocrBar" hidden>
      <div class="t" id="ocrText">酒柜识别中... ...</div>
      <div class="ocr-track"><i id="ocrFill"></i></div>
    </div>
    <div class="inv-toolbar">
      <div class="search-box">
        <span class="ico">🔍</span>
        <input type="text" id="invSearch" placeholder="搜索原料，如：金酒、薄荷、可乐…" autocomplete="off">
        <button class="search-clear" id="searchClear" type="button">×</button>
      </div>
      <button class="fav-entry" id="favEntry" type="button">♥ 我的收藏 <b id="favCount">0</b></button>
    </div>
    <div id="catList"></div>
    <div class="search-empty" id="searchEmpty">没有匹配的原料，可在对应分类点「＋ 添加」手动加入</div>
    <input type="file" id="photoInputCamera" accept="image/*" capture="environment" hidden>
    <input type="file" id="photoInputAlbum" accept="image/*" hidden>
  </section>

  <div class="gen-wrap">
    <button class="gen-btn" id="genBtn">生成今晚的酒单</button>
  </div>

  <section class="results" id="results" hidden>
    <div class="results-head">
      <h2 id="resultTitle"></h2>
      <p id="resultSub"></p>
    </div>
    <div id="recipeCards"></div>
    <div class="shuffle-wrap">
      <button class="shuffle-btn" id="shuffleBtn">换一批推荐</button>
    </div>
  </section>

  <section class="fav-section panel" id="favSection" hidden>
    <div class="panel-head">
      <h2>♥ 我的收藏</h2>
      <div class="panel-actions">
        <button class="mini-btn" id="favClose" type="button">收起</button>
      </div>
    </div>
    <div id="favList" style="margin-top:14px"></div>
  </section>

  <footer>
    配方用量为经典比例，可按个人口味微调酸甜与酒感<br>
    理性饮酒 · 未成年人请勿饮酒 · 酒后请勿驾车
  </footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <h3>识别到几种清单外的酒</h3>
    <p class="modal-sub" id="modalIntro"></p>
    <div id="modalRows"></div>
    <div class="modal-actions">
      <button class="modal-cancel" id="modalCancel">不添加</button>
      <button class="modal-ok" id="modalOk">添加选中的酒</button>
    </div>
  </div>
</div>

<div class="dock" id="dock">
  <span class="dock-info">已选 <b id="dockCount">0</b> 样</span>
  <button class="dock-btn" id="dockGen" type="button">生成今晚的酒单</button>
  <button class="dock-up" id="dockUp" type="button" title="回到酒柜">↑</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="shareModal" hidden>
  <div class="modal-card share-card">
    <h3 id="shareTitle" style="margin-bottom:12px">分享这杯酒</h3>
    <img id="shareImg" alt="配方分享图">
    <p class="share-tip">点「复制图片」后可直接粘贴到聊天框；手机长按图片也可保存到相册，电脑端右键即可另存</p>
    <div class="share-actions">
      <button class="modal-cancel" id="shareCopy" type="button">复制文字版</button>
      <button class="modal-ok" id="shareDone" type="button">复制图片</button>
    </div>
  </div>
</div>

    try {

        custom: state.custom
      }));
    } catch (e) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      (data.inv || []).forEach(function (id) { state.inv[id] = true; });
      CUSTOM_CATS.forEach(function (c) {
        (data.custom && data.custom[c] || []).forEach(function (pair) {
          if (pair && pair[0] && pair[1]) {
            state.custom[c].push([pair[0], pair[1]]);
            NAME[pair[0]] = pair[1];
          }
        });
      });
    } catch (e) {}
  }

  function isCustomId(id) { return String(id).indexOf("cu_") === 0; }

  function addCustomItem(catId, name, selectIt) {
    name = (name || "").trim().replace(/\s+/g, " ");
    if (!name) return null;
    var key = name.toLowerCase();
    var existing = null;
    CUSTOM_CATS.forEach(function (c) {
      (state.custom[c] || []).forEach(function (pair) {
        if (!existing && pair[1].toLowerCase() === key) existing = pair[0];
      });
    });
    if (existing) {
      if (selectIt) state.inv[existing] = true;
      save();
      return existing;
    }
    var id = "cu_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    state.custom[catId] = state.custom[catId] || [];
    state.custom[catId].push([id, name]);
    NAME[id] = name;
    if (selectIt) state.inv[id] = true;
    save();
    return id;
  }

  function removeCustomItem(id) {
    CUSTOM_CATS.forEach(function (c) {

  function renderCats() {
    var box = $("catList");
    box.innerHTML = "";
    var anyMatch = false;
    CATS.forEach(function (cat) {
      var sec = document.createElement("div");
      sec.className = "cat";
      sec.dataset.cat = cat.id;
      if (collapsedCats[cat.id] && !searchQuery) sec.classList.add("collapsed");

      var title = document.createElement("div");
      title.className = "cat-title";
      title.innerHTML = '<span class="dot"></span><span>' + cat.name + '</span><span class="cat-hint">' + cat.hint + '</span><span class="chev">⌄</span>';
      title.addEventListener("click", function () {
        collapsedCats[cat.id] = !collapsedCats[cat.id];
        sec.classList.toggle("collapsed", !!collapsedCats[cat.id] && !searchQuery);
      });
      sec.appendChild(title);

      var chips = document.createElement("div");
      chips.className = "chips";

      var items = cat.items.concat(state.custom[cat.id] || []);
      var matchedInCat = 0;
      items.forEach(function (it) {
        if (!itemMatches(it[1])) return;
        matchedInCat++;
        anyMatch = true;
        var b = document.createElement("button");
        b.className = "chip" + (isCustomId(it[0]) ? " custom" : "");
        b.dataset.id = it[0];
        b.appendChild(document.createTextNode(it[1]));
        if (state.inv[it[0]]) b.classList.add("on");

        if (isCustomId(it[0])) {
          var x = document.createElement("span");
          x.className = "chip-x";
          x.textContent = "×";
          x.title = "从清单移除";
          x.addEventListener("click", function (ev) {
            ev.stopPropagation();
            removeCustomItem(it[0]);
            renderCats();
            updateCount();
          });
          b.appendChild(x);
        }

        b.addEventListener("click", function () {
          state.inv[it[0]] = !state.inv[it[0]];
          if (!state.inv[it[0]]) delete state.inv[it[0]];
          b.classList.toggle("on");
          updateCount();
          save();
        });
        chips.appendChild(b);
      });

      if (!searchQuery && CUSTOM_CATS.indexOf(cat.id) !== -1) {
        var add = document.createElement("button");
        add.className = "chip add";
        add.textContent = "＋ 添加";
        add.addEventListener("click", function () {
          add.style.display = "none";
          var form = document.createElement("span");
          form.className = "chip-form";
          var input = document.createElement("input");
          input.type = "text";
          input.placeholder = "输入" + cat.name.replace(/\s*\/\s*甜味|\s*·\s*软饮/g, "") + "名称";
          var ok = document.createElement("button");
          ok.className = "ok";
          ok.textContent = "✓";
          var cancel = document.createElement("button");
          cancel.className = "cancel";
          cancel.textContent = "✕";
          form.appendChild(input);
          form.appendChild(ok);
          form.appendChild(cancel);
          chips.appendChild(form);
          input.focus();

          function done(commit) {
            var val = input.value;
            if (commit) {
              var id = addCustomItem(cat.id, val, true);
              if (id) showToast("已添加并勾选：" + val.trim());
            }
            renderCats();
            updateCount();
          }
          ok.addEventListener("click", function () { done(true); });
          cancel.addEventListener("click", function () { done(false); });
          input.addEventListener("keydown", function (e) {
            if (e.key === "Enter") done(true);
            if (e.key === "Escape") done(false);
          });
        });
        chips.appendChild(add);
      }

      sec.appendChild(chips);
      if (searchQuery && !matchedInCat) sec.style.display = "none";
      box.appendChild(sec);
    });
    $("searchEmpty").style.display = (searchQuery && !anyMatch) ? "block" : "none";
  }

  function creativeStrength(spiritMl, proseccoMl, totalMl) {
    if (!spiritMl && !proseccoMl) return 0;
    var eff = spiritMl + proseccoMl * 0.25;

    if (r >= 0.5) return 3;

        var ids4 = ings4.map(function (i) { return i.item; });

          "雪克壶中加冰，倒入" + ings4.map(function (i) { return NAME[i.item]; }).join("、"),
          "快速摇荡约15秒，让质地均匀冰滑",
          "滤冰倒入古典杯，入口绵密，像一杯可以喝的甜点，慢品"
        ];
        var desc4 = "奶香把" + baseWord(spirit) + "的棱角磨得圆润，入口丝滑、甜而不腻，" +
          "饭后不想点甜品时，来这一杯正好。";
        push(mk("creamy", spirit, "古典杯", "摇和",
          creativeStrength(40, 0, 40 + (creamLiq ? 20 : 0) + (cream ? 30 : 0)),
          creativeTags(ids4, null).concat(["浓郁"]).slice(0, 4), desc4, ings4, steps4));
      }
    }

    // ⑤ 纯饮加冰：只有烈酒
    if (spirit) {
      var ings5 = [{ item: spirit, amount: "45ml" }];
      var g5 = state.inv.lemon_fresh ? "柠檬皮捲" : "无需额外装饰";
      var steps5 = [
        "古典杯中放一块大方冰（没有就加满冰块）",
        "倒入" + baseWord(spirit) + "，轻轻搅拌约10秒给酒降温",
        (g5 === "柠檬皮捲" ? "拧一片柠檬皮捲在杯口抹过、投入杯中提香，" : "") + "纯饮慢品，感受它本来的香气"
      ];
      var desc5 = "不加任何修饰，冰镇后的" + baseWord(spirit) + "酒精刺激感降低、香气更聚拢，" +
        "适合想安安静静喝一杯的时候。";
      push(mk("rocks", spirit, "古典杯", "纯饮 · 加冰", 3,
        creativeTags([spirit], null), desc5, ings5, steps5, g5));
    }

    // ⑥ 无酒精宾治：完全没有酒时
    if (!spirit && !hasProsecco) {
      var mj = juices[0] || mixerCustom[0] || null;
      var need = mj || citrus.length || state.inv.mint;
      var top6 = sparklers[0] || null;
      if (need && (mj || top6)) {
        var ings6 = [];
        if (mj) ings6.push({ item: mj, amount: "60ml" });
        if (citrus[0]) ings6.push({ item: citrus[0], amount: "15ml" });
        if (syrups[0]) ings6.push({ item: syrups[0], amount: "10ml" });
        if (state.inv.mint) ings6.push({ item: "mint", amount: "6–8 片" });
        if (top6) ings6.push({ item: top6, amount: "补满（约90ml）" });
        if (ings6.length >= 2) {
          var ids6 = ings6.map(function (i) { return i.item; });
          var pour6 = ings6.filter(function (i) { return i.item !== top6 && i.item !== "mint"; }).map(function (i) { return NAME[i.item]; });
          var steps6 = [
            "高球杯加满冰块" + (pour6.length ? "，倒入" + pour6.join("、") : ""),
            (state.inv.mint ? "薄荷叶轻拍放入杯中；" : "") + (top6 ? "注满" + NAME[top6] + "补出气泡；" : "充分搅拌均匀；"),
            "加上装饰，开车或不想喝酒时也能尽兴"
          ];
          var desc6 = "用果汁与气泡搭出一杯无酒精特饮，酸甜清爽、仪式感不减，" +
            "全家都能喝。";
          push(mk("mocktail", null, "高球杯", "兑和 · 搅拌", 0,
            creativeTags(ids6, citrus.length && syrups.length ? "sweetSour" : (citrus.length ? "sour" : null)),
            desc6, ings6, steps6));
        }
      }
    }

    // ⑦ 只有起泡酒：冰镇纯饮
    if (!spirit && hasProsecco) {
      var ings7 = [{ item: "prosecco", amount: "120ml" }];
      var steps7 = [
        "起泡酒提前冰至 6–8℃",
        "倒入香槟杯或高脚杯，趁气泡细密时饮用",
        "本身就是一杯开胃酒，酸度清爽、不用调"
      ];
      push(mk("solo", null, "香槟杯", "直接冰镇",
        creativeStrength(0, 120, 120),
        creativeTags(["prosecco"], null), "气泡细腻、酸度干净，餐前一杯开胃醒神。",
        ings7, steps7, "无需额外装饰"));
    }

    return out.slice(0, 3);
  }

  var pool = [];
  var curBatch = [];

  function generate() {
    if (!Object.keys(state.inv).length) {
      showToast("先勾选家里现有的酒料吧～");
      return;
    }
    var scored = scoreRecipes();
    var perfect = scored.filter(function (s) { return s.score === 0; })
      .sort(function (a, b) { return b.recipe.pop - a.recipe.pop; });
    var near = scored.filter(function (s) { return s.score > 0; })
      .sort(function (a, b) { return a.score - b.score || b.recipe.pop - a.recipe.pop; });

    curBatch = [];
    $("results").hidden = false;

    if (perfect.length > 0) {
      pool = perfect;
      $("resultTitle").textContent = "今晚，这几杯用你酒柜里的材料就能调";
      $("resultSub").textContent = "共匹配 " + perfect.length + " 款配方，全部原料均来自你勾选的库存";
      renderCards();
    } else {
      var creative = buildCreativeRecipes();
      if (creative.length) {
        pool = creative.map(function (r) { return { recipe: r, missing: [], score: 0 }; });
        $("resultTitle").textContent = "经典配方凑不齐？先用酒柜里的材料调这几杯";
        $("resultSub").textContent = "以下创意特调全部由你勾选的材料组合而成，用量可按口味微调";
        renderCards();
        if (near.length) renderNearHint(near.slice(0, 3));
      } else {
        pool = [];
        $("resultTitle").textContent = "当前库存还凑不齐一款完整配方";
        $("resultSub").textContent = "下面几款最接近，补齐标出的材料即可解锁（不会擅自给你加料）";
        renderEmpty(near.slice(0, 3));
      }
    }
    setTimeout(function () {
      $("results").scrollIntoView({ behavior: "smooth", block: "start" });
      setTimeout(syncDock, 700);
    }, 80);
  }

  function nearHintCard(near) {
    var card = document.createElement("div");
    card.className = "recipe-card";
    card.innerHTML = '<div class="r-section-t">想调经典款？补齐这些材料即可解锁</div>' +
      near.map(function (s) {
        var missNames = s.missing.map(function (id) { return NAME[id]; }).join("、");
        return '<div class="hint-row">' +
          '<span class="hint-name">' + esc(s.recipe.name) + "</span>" +
          '<span class="hint-miss">还差：' + esc(missNames) + "</span>" +
          "</div>";
      }).join("");
    return card;
  }

  function renderEmpty(near) {
    var box = $("recipeCards");
    box.innerHTML = "";
    $("shuffleBtn").style.display = "none";
    if (!near.length) return;
    box.appendChild(nearHintCard(near));
  }

  function renderNearHint(near) {
    if (!near.length) return;
    $("recipeCards").appendChild(nearHintCard(near));
  }

  function garnishFor(r) {
    var raw = r.garnish || "";
    if (raw.indexOf("无需") === 0) return raw;
    var pieces = raw.split(/\s*[+/、]\s*/).filter(Boolean);
    var kept = pieces.map(function (p) {
      var need = null;
      if (p.indexOf("薄荷") >= 0) need = "mint";
      else if (p.indexOf("青柠") >= 0) need = "lime";
      else if (p.indexOf("西柚") >= 0) need = "grapefruit";
      else if (p.indexOf("菠萝") >= 0) need = "pineapple";
      else if (p.indexOf("橙") >= 0) need = "orange";
      else if (p.indexOf("柠檬") >= 0) need = "lemon_fresh";
      else if (p.indexOf("樱桃") >= 0 || p.indexOf("橄榄") >= 0) need = "__none__";
      return { text: p.replace(/（可选）/g, ""), need: need };
    }).filter(function (p) {
      if (p.need === "__none__") return false;
      if (!p.need) return true;
      return !!state.inv[p.need];
    }).map(function (p) { return p.text; });
    return kept.length ? kept.join(" + ") : "无需额外装饰";
  }

  function renderCards() {
    var box = $("recipeCards");
    box.innerHTML = "";
    if (!pool.length) {
      $("shuffleBtn").style.display = "none";
      return;
    }
    var batchValid = curBatch.length && curBatch.every(function (s) { return pool.indexOf(s) !== -1; });
    if (!batchValid) curBatch = pool.slice(0, Math.min(3, pool.length));
    curBatch.forEach(function (s, idx) {
      box.appendChild(renderCard(s, idx));
    });
    $("shuffleBtn").style.display = pool.length > 3 ? "" : "none";
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function itemNameOf(id, names) { return NAME[id] || (names && names[id]) || id; }

  function scaleAmount(text, n) {
    if (n === 1) return text;
    return text.replace(/\d+(?:\.\d+)?/g, function (d) {
      var v = Math.round(parseFloat(d) * n * 10) / 10;
      return String(v);
    });
  }

  function amountMl(text) {
    var m = /(\d+(?:\.\d+)?)\s*ml/i.exec(text);
    return m ? parseFloat(m[1]) : 0;
  }
  function ingsMlPerCup(ings) {
    return Math.round(ings.reduce(function (sum, ing) { return sum + amountMl(ing.amount); }, 0));
  }
  function ingTitle(n, perCup) {
    if (!perCup) return "配方用量（" + n + "杯）";
    if (n === 1) return "配方用量（1杯 · 约" + perCup + "ml）";
    return "配方用量（" + n + "杯 · 共约" + Math.round(perCup * n) + "ml）";
  }

  function renderCard(s, idx, opts) {
    opts = opts || {};
    var r = s.recipe;
    var names = opts.names || null;
    var favMode = !!opts.favMode;
    var card = document.createElement("div");
    card.className = "recipe-card";
    card._servings = 1;

    var badge;
    if (favMode) badge = '<span class="badge fav">♥ 我的收藏</span>';
    else if (r.creative) badge = '<span class="badge creative">✦ 创意特调 · 材料齐全</span>';
    else if (s.score === 0) badge = '<span class="badge ok">✓ 材料齐全，直接调</span>';
    else badge = '<span class="badge no">还差 ' + s.score + " 样</span>";

    var tagsHtml = r.tags.map(function (t) {
      var c = TAG_COLORS[t] || "#d4af6a";
      return '<span class="tag" style="color:' + c + ';border-color:' + c + "66;background:" + c + "1a\">" + t + "</span>";
    }).join("");

    var dots = "";
    for (var d = 1; d <= 3; d++) dots += '<span class="sd' + (d <= r.strength ? " on" : "") + '"></span>';

    var shownIngs = favMode ? r.ingredients : r.ingredients.filter(function (ing) { return !!state.inv[ing.item]; });
    var mlPerCup = ingsMlPerCup(shownIngs);
    card._mlPerCup = mlPerCup;
    var garnishText = favMode ? (r.garnish || "无需额外装饰") : garnishFor(r);

    var ingsHtml = shownIngs.map(function (ing) {
      var label = itemNameOf(ing.item, names) + (ing.optional ? "（可选）" : "");
      return '<div class="ing-row' + (favMode ? "" : " have") + '">' +
        '<span class="ing-name"><span class="sdot"></span><span>' + esc(label) + "</span></span>" +
        '<span class="ing-amount" data-base="' + esc(ing.amount) + '">' + esc(ing.amount) + "</span>" +
        "</div>";
    }).join("");

    var stepsHtml = r.steps.map(function (st) {
      return '<li data-act="step">' + esc(st) + "</li>";
    }).join("");

    var faved = isFav(r);
    card.innerHTML =
      (favMode ? "" : '<div class="r-num">0' + (idx + 1) + "</div>") +
      badge +
      '<div class="r-name">' + esc(r.name) + "</div>" +
      '<div class="r-en">' + esc(r.en) + "</div>" +
      '<div class="r-meta">' +
        '<span class="meta-item">杯型：' + esc(r.glass) + "</span>" +
        '<span class="meta-item">做法：' + esc(r.method) + "</span>" +
        '<span class="meta-item strength">' + dots + "&nbsp;" + STRENGTH[r.strength] + "</span>" +
      "</div>" +
      '<div class="tags">' + tagsHtml + "</div>" +
      '<p class="r-desc">' + esc(r.desc) + "</p>" +
      '<div class="r-section-row">' +
        '<div class="r-section-t" data-role="ing-title">' + esc(ingTitle(1, mlPerCup)) + "</div>" +
        '<div class="servings">' +
          '<button data-act="svminus" type="button" disabled>−</button>' +
          '<span class="sv-num"><b data-role="svnum">1</b> 杯</span>' +
          '<button data-act="svplus" type="button">+</button>' +
        "</div>" +
      "</div>" +
      ingsHtml +
      '<div class="r-section-t">调制步骤（点一下标记完成）</div>' +
      '<ol class="steps">' + stepsHtml + "</ol>" +
      '<div class="r-garnish"><b>装饰：</b>' + esc(garnishText) + "</div>" +
      '<div class="r-actions">' +
        '<button class="act-btn' + (faved ? " faved" : "") + '" data-act="fav" type="button">' + (faved ? "♥ 已收藏" : "♡ 收藏") + "</button>" +
        '<button class="act-btn" data-act="copy" type="button">📋 复制配方</button>' +
        '<button class="act-btn" data-act="share" type="button">🖼 生成分享图</button>' +
        '<span class="step-progress" data-role="step-progress"></span>' +
      "</div>";

    card._payload = { r: r, names: names, favMode: favMode, ings: shownIngs, garnishText: garnishText };
    refreshStepProgress(card);
    return card;
  }

  function applyServings(card) {
    var n = card._servings;
    card.querySelectorAll(".ing-amount[data-base]").forEach(function (el) {
      el.textContent = scaleAmount(el.getAttribute("data-base"), n);
    });
    var num = card.querySelector("[data-role=svnum]");
    if (num) num.textContent = n;
    var title = card.querySelector("[data-role=ing-title]");
    if (title) title.textContent = ingTitle(n, card._mlPerCup || 0);
    var minus = card.querySelector('[data-act="svminus"]');
    var plus = card.querySelector('[data-act="svplus"]');
    if (minus) minus.disabled = n <= 1;
    if (plus) plus.disabled = n >= 6;
  }

  function refreshStepProgress(card) {
    var all = card.querySelectorAll(".steps li");
    var done = card.querySelectorAll(".steps li.done");
    var el = card.querySelector("[data-role=step-progress]");
    if (el) el.textContent = all.length ? "调制进度 " + done.length + "/" + all.length : "";
  }

  function refreshFavBtn(card) {
    var on = isFav(card._payload.r);
    var btn = card.querySelector('[data-act="fav"]');
    if (btn) {
      btn.classList.toggle("faved", on);
      btn.textContent = on ? "♥ 已收藏" : "♡ 收藏";
    }
  }

  function recipeText(p, servings) {
    var r = p.r;
    var L = [];
    L.push("【" + r.name + " " + r.en + "】" + (r.creative ? "（创意特调）" : ""));
    L.push("风味：" + r.tags.join(" · "));
    L.push("杯型：" + r.glass + "　做法：" + r.method + "　度数：" + STRENGTH[r.strength]);
    L.push(ingTitle(servings, ingsMlPerCup(p.ings)) + "：");
    p.ings.forEach(function (ing) {
      L.push("· " + itemNameOf(ing.item, p.names) + (ing.optional ? "（可选）" : "") + "　" + scaleAmount(ing.amount, servings));
    });
    L.push("装饰：" + p.garnishText);
    L.push("调制步骤：");
    r.steps.forEach(function (st, i) { L.push((i + 1) + ". " + st); });
    L.push("—— 来自「家庭调酒台」");
    return L.join("\n");
  }

  function copyText(t) {
    function ok() { showToast("配方已复制，去粘贴分享吧"); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = t;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); ok(); }
      catch (e) { showToast("复制失败，请手动选择文本复制"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(ok).catch(fallback);
    } else fallback();
  }

  function wrapLines(ctx, text, maxWidth) {
    var lines = [];
    var line = "";
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (ctx.measureText(line + ch).width > maxWidth && line) {
        lines.push(line);
        line = ch;
      } else line += ch;
    }
    if (line) lines.push(line);
    return lines;
  }

  function drawShareCard(p, servings) {
    var r = p.r;
    var W = 750;
    var cv = document.createElement("canvas");
    cv.width = W;
    var ctx = cv.getContext("2d");

    var ingList = p.ings.slice(0, 7);

    ctx.font = "bold 52px 'PingFang SC','Microsoft YaHei',sans-serif";
    var nameLines = wrapLines(ctx, r.name, 600).slice(0, 2);
    ctx.font = "21px 'PingFang SC',sans-serif";
    var garnishLines = wrapLines(ctx, "装饰：" + p.garnishText, 610).slice(0, 2);
    ctx.font = "22px 'PingFang SC',sans-serif";
    var stepGroups = r.steps.map(function (st) { return wrapLines(ctx, st, 580).slice(0, 2); });
    var stepRows = stepGroups.reduce(function (n, g) { return n + g.length; }, 0);

    var endY = 150 + nameLines.length * 62 + 56 + 66 + 24 + 46 + 18;
    endY += 44 * ingList.length;
    endY += 40 + 30 * garnishLines.length + 14 + 42 + 14;
    endY += 34 * stepRows;

    var footLineY = endY + 34;
    var H = Math.max(820, endY + 140);
    cv.height = H;

    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#0c1f1a");
    bg.addColorStop(1, "#060d0b");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "rgba(212,175,106,0.75)";
    ctx.lineWidth = 2;
    ctx.strokeRect(28, 28, W - 56, H - 56);
    ctx.strokeStyle = "rgba(212,175,106,0.28)";
    ctx.lineWidth = 1;
    ctx.strokeRect(38, 38, W - 76, H - 76);

    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(236,211,154,0.85)";
    ctx.font = "20px Georgia, serif";
    ctx.fillText("H O M E　B A R　·　家 庭 调 酒 台", W / 2, 92);

    var y = 150;
    ctx.fillStyle = "#ecd39a";
    ctx.font = "bold 52px 'PingFang SC','Microsoft YaHei',sans-serif";
    nameLines.forEach(function (ln) { ctx.fillText(ln, W / 2, y); y += 62; });

    ctx.fillStyle = "rgba(242,237,225,0.55)";
    ctx.font = "italic 26px Georgia, serif";
    ctx.fillText(r.en + (r.creative ? " · House Creation" : ""), W / 2, y + 6);
    y += 56;

    var tagW = 0, gap = 14, tw = [];
    ctx.font = "20px 'PingFang SC',sans-serif";
    r.tags.slice(0, 5).forEach(function (t) {
      var w = ctx.measureText(t).width + 40;
      tw.push(w); tagW += w;
    });
    tagW += gap * Math.max(0, tw.length - 1);
    var tx = (W - tagW) / 2;
    r.tags.slice(0, 5).forEach(function (t, i) {
      var c = TAG_COLORS[t] || "#d4af6a";
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(tx, y, tw[i], 36, 18); else ctx.rect(tx, y, tw[i], 36);
      ctx.fillStyle = c + "22"; ctx.fill();
      ctx.strokeStyle = c + "99"; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = c; ctx.textAlign = "center";
      ctx.fillText(t, tx + tw[i] / 2, y + 25);
      tx += tw[i] + gap;
    });
    y += 66;

    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(242,237,225,0.7)";
    ctx.font = "22px 'PingFang SC',sans-serif";
    ctx.fillText(r.glass + "　｜　" + r.method + "　｜　" + STRENGTH[r.strength], W / 2, y);
    y += 24;
    ctx.strokeStyle = "rgba(212,175,106,0.4)";
    ctx.beginPath(); ctx.moveTo(70, y); ctx.lineTo(W - 70, y); ctx.stroke();

    y += 46;
    ctx.textAlign = "left";
    ctx.fillStyle = "#ecd39a";
    ctx.font = "bold 26px 'PingFang SC',sans-serif";
    ctx.fillText(ingTitle(servings, ingsMlPerCup(p.ings)), 70, y);
    y += 18;
    ctx.font = "24px 'PingFang SC',sans-serif";
    ingList.forEach(function (ing) {
      y += 44;
      ctx.fillStyle = "rgba(242,237,225,0.92)";
      var label = itemNameOf(ing.item, p.names) + (ing.optional ? "（可选）" : "");
      ctx.fillText(label, 70, y);
      ctx.fillStyle = "rgba(212,175,106,0.95)";
      ctx.textAlign = "right";
      ctx.fillText(scaleAmount(ing.amount, servings), W - 70, y);
      ctx.textAlign = "left";
    });
    y += 40;
    ctx.fillStyle = "rgba(242,237,225,0.5)";
    ctx.font = "21px 'PingFang SC',sans-serif";
    garnishLines.forEach(function (ln) { ctx.fillText(ln, 70, y); y += 30; });

    y += 14;
    ctx.strokeStyle = "rgba(212,175,106,0.28)";
    ctx.beginPath(); ctx.moveTo(70, y); ctx.lineTo(W - 70, y); ctx.stroke();
    y += 42;
    ctx.fillStyle = "#ecd39a";
    ctx.font = "bold 26px 'PingFang SC',sans-serif";
    ctx.fillText("调制步骤", 70, y);

  function loadScript(url) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = url;
      s.onload = resolve;
      s.onerror = function () {
        fetch(url)
          .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.text(); })
          .then(function (code) {
            var el = document.createElement("script");
            el.textContent = code;

          .catch(function () { reject(new Error("script load failed: " + url)); });
      };
      document.head.appendChild(s);

  function compressImageForOcr(file) {
    return new Promise(function (resolve) {
      if (!/^image\//.test(file.type)) { resolve(file); return; }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var maxSide = 1280;
        var w = img.naturalWidth, h = img.naturalHeight, longest = Math.max(w, h);
        if (!longest || longest <= maxSide) { resolve(file); return; }
        var s = maxSide / longest;
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(w * s);
        canvas.height = Math.round(h * s);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function (blob) {
          resolve(blob && blob.size < file.size ? blob : file);
        }, "image/jpeg", 0.9);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  async function runRemoteOCR(file) {

    var fd = new FormData();
    fd.append("file", blob, "bottle.jpg");
    setOcrProgress(0.18, "酒柜识别中... ...");
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, OCR_API_TIMEOUT);
    var hintTimer = setTimeout(function () {
      setOcrProgress(0.4, "酒柜识别中... ...");
    }, 8000);
    try {
      var resp = await fetch(OCR_API_URL + "/ocr", {
        method: "POST",
        body: fd,
        signal: ctrl.signal,
        headers: { "bypass-tunnel-reminder": "true" }
      });
      if (!resp.ok) throw new Error("api " + resp.status);
      return await resp.json();
    } finally {
      clearTimeout(timer);
      clearTimeout(hintTimer);
    }
  }

  function ensureTesseract() {
    if (window.Tesseract) return Promise.resolve();

    return Tesseract.createWorker(cfg.langs, 1, {

      corePath: cfg.corePath,
      langPath: cfg.langPath,
      logger: logger
    });

  async function runTesseractOCR(file) {
    setOcrProgress(0.05, "酒柜识别中... ...");
    await ensureTesseract();
    var worker = null, lastErr = null;
    for (var i = 0; i < TESS_CDNS.length; i++) {
      try {
        setOcrProgress(0.1, "酒柜识别中... ...");
        worker = await createOcrWorker(TESS_CDNS[i], function (m) {
          if (m.status === "recognizing text") {
            setOcrProgress(0.25 + m.progress * 0.7, "酒柜识别中... ...");
          }
        });
        break;
      } catch (e) { lastErr = e; }
    }
    if (!worker) throw lastErr || new Error("ocr init failed");
    setOcrProgress(0.25, "酒柜识别中... ...");
    var ret = await worker.recognize(file);
    await worker.terminate();
    return (ret.data && ret.data.text) || "";
  }

        }
      }
      var text = await runTesseractOCR(file);
      applyOcrResult(text);
    } catch (e) {
      hideOcrProgress();
      showToast("识别组件加载失败，请检查网络，或直接点「＋ 添加」手动录入");
    }
  }

  function matchOcr(text) {
    var hay = " " + text.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, " ") + " ";
    var hayCjk = hay.replace(/\s+/g, "");
    function hit(alias) {
      alias = alias.toLowerCase();
      if (/[\u4e00-\u9fa5]/.test(alias)) return hayCjk.indexOf(alias) !== -1;
      var pat = alias.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+");
      return new RegExp("(^|\\s)" + pat + "(\\s|$)").test(hay);
    }
    var matched = [];
    Object.keys(ALIASES).forEach(function (id) {
      if (ALIASES[id].some(hit)) matched.push(id);
    });
    Object.keys(NAME).forEach(function (id) {
      if (!isCustomId(id)) return;
      var nm = NAME[id].toLowerCase();
      if (/[\u4e00-\u9fa5]/.test(nm)) { if (hayCjk.indexOf(nm) !== -1) matched.push(id); }
      else if (hit(nm)) matched.push(id);
    });
    return matched.filter(function (v, i, a) { return a.indexOf(v) === i; });
  }

  function extractCandidates(raw) {
    var aliasWords = {};
    Object.keys(ALIASES).forEach(function (id) {
      ALIASES[id].forEach(function (a) {
        a.toUpperCase().split(/[^A-Z]+/).forEach(function (w) { if (w.length >= 3) aliasWords[w] = true; });
      });
    });
    var toks = (raw.match(/[A-Za-z][A-Za-z'&.]{2,}/g) || []).map(function (w) {
      var letters = w.replace(/[^A-Za-z]/g, "");
      var labelLike = w === w.toUpperCase() || /^[A-Z][a-z]+/.test(w);
      return { up: letters.toUpperCase(), labelLike: labelLike };
    }).filter(function (t) {
      return t.labelLike && t.up.length >= 4 && !STOPWORDS.has(t.up) && !aliasWords[t.up];
    });
    var cands = {};
    for (var i = 0; i < toks.length; i++) {
      var u = toks[i].up;
      cands[u] = true;
      if (i + 1 < toks.length && toks[i + 1].labelLike) {
        var bi = u + " " + toks[i + 1].up;
        if (bi.length <= 22) cands[bi] = true;
      }
    }
    var list = Object.keys(cands).sort(function (a, b) { return b.length - a.length; });
    var picked = [];
    list.forEach(function (c) {
      if (picked.length >= 8) return;
      if (picked.some(function (p) { return p.indexOf(c) !== -1 || (c.indexOf(p) !== -1 && Math.abs(c.length - p.length) <= 3); })) return;
      picked.push(c);
    });
    return picked;
  }

  function applyOcrResult(text) {
    hideOcrProgress();
    var matched = matchOcr(text);
    matched.forEach(function (id) { state.inv[id] = true; });
    save();
    renderCats();
    updateCount();

    var cands = extractCandidates(text);
    var matchedPhrases = matched.filter(isCustomId).map(function (id) {
      return NAME[id].toLowerCase().replace(/\s+/g, " ").trim();
    });
    if (matchedPhrases.length) {
      cands = cands.filter(function (c) {
        var cl = c.toLowerCase();
        return !matchedPhrases.some(function (p) {
          var pat = p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+");
          return new RegExp("(^|\\s)" + pat + "(\\s|$)").test(" " + cl + " ");
        });
      });
    }
    if (cands.length) {
      openUnknownModal(cands, matched.length);
    } else if (matched.length) {
      showToast("识别完成，已自动勾选 " + matched.length + " 种酒");
      generate();
    } else {
      showToast("没有识别出可匹配的酒，可手动点「＋ 添加」录入");
    }
  }

  var MODAL_CATS = [["base", "基酒"], ["liqueur", "利口酒"], ["syrup", "糖浆"], ["mixer", "软饮"]];

  function openUnknownModal(cands, matchedCount) {
    var rows = $("modalRows");
    rows.innerHTML = "";
    $("modalIntro").textContent = "已自动勾选 " + (matchedCount || 0) + " 种清单内的酒。以下 " +
      cands.length + " 种未收录，勾选并选择分类后可加入你的酒柜清单（也可修改名称）：";
    cands.forEach(function (name) {
      var row = document.createElement("div");
      row.className = "modal-row";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = true;
      var inp = document.createElement("input");
      inp.type = "text";
      inp.value = name;
      var sel = document.createElement("select");
      MODAL_CATS.forEach(function (o) {
        var op = document.createElement("option");
        op.value = o[0];
        op.textContent = o[1];
        sel.appendChild(op);
      });
      row.appendChild(cb);
      row.appendChild(inp);
      row.appendChild(sel);
      rows.appendChild(row);
    });
    $("modal").hidden = false;

    $("modalOk").onclick = function () {
      var n = 0;
      rows.querySelectorAll(".modal-row").forEach(function (row) {
        var cb = row.querySelector('input[type="checkbox"]');
        var inp = row.querySelector('input[type="text"]');
        var sel = row.querySelector("select");
        if (cb.checked && addCustomItem(sel.value, inp.value, true)) n++;
      });
      $("modal").hidden = true;
      renderCats();
      updateCount();
      showToast(n ? "已新增 " + n + " 种酒到清单并勾选" : "识别结果已应用");
      generate();
    };
    $("modalCancel").onclick = function () {
      $("modal").hidden = true;
      if (matchedCount) {
        showToast("识别完成，已自动勾选 " + matchedCount + " 种酒");
        generate();
      }
    };
  }

  $("genBtn").addEventListener("click", generate);
  function bindPhotoPick(btnId, inputId) {
    $(btnId).addEventListener("click", function () { $(inputId).click(); });
    $(inputId).addEventListener("change", function (e) {
      var f = e.target.files && e.target.files[0];
      if (f) handlePhoto(f);
      e.target.value = "";
    });
  }
  bindPhotoPick("photoBtn", "photoInputCamera");
  bindPhotoPick("albumBtn", "photoInputAlbum");

  $("shuffleBtn").addEventListener("click", function () {
    if (pool.length <= 3) return;
    var prevKeys = {};
    (curBatch.length ? curBatch : pool.slice(0, 3)).forEach(function (s) {
      prevKeys[favKey(s.recipe)] = true;
    });
    var cand = pool.filter(function (s) { return !prevKeys[favKey(s.recipe)]; });
    for (var i = cand.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = cand[i]; cand[i] = cand[j]; cand[j] = t;
    }
    curBatch = cand.slice(0, Math.min(3, cand.length));
    renderCards();
  });

  var searchInput = $("invSearch");
  searchInput.addEventListener("input", function () {
    searchQuery = searchInput.value.trim().toLowerCase();
    $("searchClear").classList.toggle("show", !!searchQuery);
    renderCats();
  });
  $("searchClear").addEventListener("click", function () {
    searchInput.value = "";
    searchQuery = "";
    $("searchClear").classList.remove("show");
    renderCats();
    searchInput.focus();
  });

  $("favEntry").addEventListener("click", function () {
    var sec = $("favSection");
    sec.hidden = false;
    renderFavs();
    setTimeout(function () { sec.scrollIntoView({ behavior: "smooth", block: "start" }); }, 40);
  });
  $("favClose").addEventListener("click", function () {
    $("favSection").hidden = true;
  });

  $("dockGen").addEventListener("click", generate);
  $("dockUp").addEventListener("click", function () {
    var panel = document.querySelector("section.panel");
    (panel || $("catList")).scrollIntoView({ behavior: "smooth", block: "start" });
  });
  function syncDock() {
    var passed = $("genBtn").getBoundingClientRect().bottom < 0;
    $("dock").classList.toggle("show", passed);
  }
  if ("IntersectionObserver" in window) {
    var dockIO = new IntersectionObserver(function () { syncDock(); }, { threshold: [0, 1] });
    dockIO.observe($("genBtn"));
  }
  var dockTick = false;
  window.addEventListener("scroll", function () {
    if (dockTick) return;
    dockTick = true;
    requestAnimationFrame(function () {
      syncDock();
      dockTick = false;
    });
  }, { passive: true, capture: true });
  window.addEventListener("scrollend", syncDock, { passive: true });
  window.addEventListener("resize", syncDock);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) syncDock();
  });
  syncDock();

  $("shareDone").addEventListener("click", copyShareImage);
  $("shareModal").addEventListener("click", function (e) {
    if (e.target === this) this.hidden = true;
  });
  $("shareCopy").addEventListener("click", function () {
    if (!sharePayload) return;
    if (sharePayload.type === "site") copyText(siteShareText());
    else copyText(recipeText(sharePayload.p, sharePayload.servings));
  });
  $("siteShareBtn").addEventListener("click", openSiteShare);

  $("demoBtn").addEventListener("click", function () {
    setAll(false, allIds());
    setAll(true, DEMO);
    showToast("已填入一套常见家庭酒柜");
    generate();
  });
  $("clearBtn").addEventListener("click", function () {
    setAll(false, allIds());
    $("results").hidden = true;
    showToast("已清空酒柜");
  });

  load();
  loadFavs();
  var savedApi = localStorage.getItem("ocr-api-url");
  if (savedApi) setOcrApiUrl(savedApi);
  renderCats();
  updateCount();
  updateFavCount();
  wireCardContainer($("recipeCards"));
  wireCardContainer($("favList"));
  if (Object.keys(state.inv).length >= 2) {
    generate();
  }
  window.setOcrApiUrl = function (url) { setOcrApiUrl(url); localStorage.setItem("ocr-api-url", url || ""); };
})();
</script>
</body>
</html>
